# 天机商城 — 中间件容器编排
# 启动: docker compose up -d
# 停止: docker compose down

services:

  # ==================== Nacos 注册配置中心 ====================
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: nacos
    depends_on:
      - mysql
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - ./nacos-db.properties:/home/nacos/conf/application.properties
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== MySQL 业务数据库 ====================
  mysql:
    image: mysql:8.0.33
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tianji_mall
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass redis123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ==================== RocketMQ 消息队列 ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/store
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tlnp | grep 9876"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - JAVA_OPT_EXT=-Drocketmq.acl.enable=true
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - ./plain_acl.yml:/home/rocketmq/conf/plain_acl.yml
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tlnp | grep 10911"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== Milvus 向量数据库 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: milvus
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    command: milvus run standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==================== SkyWalking 链路监控 ====================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: skywalking-ui
    depends_on:
      - skywalking-oap
    ports:
      - "8090:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800

  # ==================== Sentinel 流量管控 ====================
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    ports:
      - "8858:8858"
    environment:
      - JAVA_OPTS=-Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8858"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  nacos-data:
  mysql-data:
  redis-data:
  rocketmq-namesrv-data:
  rocketmq-broker-data:
  etcd-data:
  minio-data:
  milvus-data:
  uploads-data:

  # ==================== 应用微服务（需先 mvn package -DskipTests） ====================

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=gateway
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    restart: unless-stopped

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=user-service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:root}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    restart: unless-stopped

  mall-goods-order:
    build:
      context: ..
      dockerfile: mall-goods-order/Dockerfile
    container_name: mall-goods-order
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=mall-goods-order
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:root}
      - REDIS_PASSWORD=${REDIS_PASSWORD:redis123}
      - ROCKETMQ_ACCESS_KEY=${ROCKETMQ_ACCESS_KEY:tianji-mall}
      - ROCKETMQ_SECRET_KEY=${ROCKETMQ_SECRET_KEY:tianji-mall-secret}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    restart: unless-stopped
    volumes:
      - uploads-data:/app/uploads

  pay-service:
    build:
      context: ..
      dockerfile: pay-service/Dockerfile
    container_name: pay-service
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=pay-service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:root}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=mcp-server
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:root}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    restart: unless-stopped

  ai-chat-service:
    build:
      context: ..
      dockerfile: ai-chat-service/Dockerfile
    container_name: ai-chat-service
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SW_SERVICE_NAME=ai-chat-service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:root}
      - NACOS_USERNAME=${NACOS_USERNAME:nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:nacos}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
    restart: unless-stopped

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
