# 本文件作为 Nacos 的 application.properties 挂载进容器。
# 注意：Docker Compose 不会替换挂载文件的内容，所以这里的 ${...}
# 是由 Nacos 自己的 Spring 启动时从容器环境变量解析的——
# MYSQL_SERVICE_PASSWORD 在 docker-compose.yml 的 nacos 服务里已设置。
spring.datasource.platform=mysql
db.num=1
db.url.0=jdbc:mysql://mysql:3306/nacos_config?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
db.user.0=root
db.password.0=${MYSQL_SERVICE_PASSWORD}
