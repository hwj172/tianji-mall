services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    networks:
      - app-net
    ports:
      - '8080:8080'
    restart: unless-stopped

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    networks:
      - app-net
    restart: unless-stopped

  mall-goods-order:
    build:
      context: ..
      dockerfile: mall-goods-order/Dockerfile
    container_name: mall-goods-order
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - JAVA_OPTS=-Xms128m -Xmx256m -Dspring.data.redis.password=${REDIS_PASSWORD:-redis123}
      - ROCKETMQ_ACCESS_KEY=${ROCKETMQ_ACCESS_KEY:-tianji-mall}
      - ROCKETMQ_SECRET_KEY=${ROCKETMQ_SECRET_KEY:-tianji-mall-secret}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    networks:
      - app-net
    restart: unless-stopped
    volumes:
      - uploads-data:/app/uploads

  pay-service:
    build:
      context: ..
      dockerfile: pay-service/Dockerfile
    container_name: pay-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - ALIPAY_APP_ID=9021000164684167
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY}
      - ALIPAY_ALIPAY_PUBLIC_
      - ALIPAY_GATEWAY_URL=https://openapi-sandbox.dl.alipaydev.com/gateway.do
      - ALIPAY_NOTIFY_URL=http://192.168.150.11:8080/api/pay/notify
    networks:
      - app-net
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    networks:
      - app-net
    restart: unless-stopped

  ai-chat-service:
    build:
      context: ..
      dockerfile: ai-chat-service/Dockerfile
    container_name: ai-chat-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    external: true
    name: root_default

volumes:
  uploads-data:
