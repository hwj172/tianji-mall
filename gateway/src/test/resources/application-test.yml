server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
    sentinel:
      enabled: false

# 测试用 JWT 密钥（HMAC-SHA256 至少 256 位 = 32 字符）
jwt:
  secret: test-secret-key-32-chars-minimum!!

# 测试用内部服务 token
internal:
  token: test-internal-token
