server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  config:
    import:
      - nacos:shared-config.yaml
      - nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.11:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: 192.168.150.11:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
        fail-fast: false
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: 192.168.150.11:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.150.11:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 30000
        pool:
          type: elastic
          max-idle-time: 60s
          max-life-time: 300s
      default-filters:
        - name: Retry
          args:
            retries: 1
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET
      discovery:
        locator:
          enabled: false
      routes:
        - id: mall-user-center
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/user/center
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: mall-product
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/product/**
        - id: mall-cart
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/cart/**
        - id: mall-order
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/order/**
        - id: mall-address
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/address/**
        - id: mall-admin
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/admin/**
        - id: mall-coupon
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/coupon/**
        - id: mall-favorite
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/favorite/**
        - id: mall-review
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/review/**
        - id: mall-shop
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/shop/**
        - id: mall-seller
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/seller/**
        - id: mall-region
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/region/**
        - id: mall-notification
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/notification/**
        - id: mall-refund
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/refund/**
        - id: mall-home
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/home, /api/home/**
        - id: mall-group-buy
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/group-buy/**
        - id: mall-upload
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/upload/**
        - id: mall-uploads
          uri: lb://mall-goods-order
          predicates:
            - Path=/uploads/**
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/api/pay/**
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/api/tool/**
        - id: ai-chat-service
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/chat/**
        - id: ai-chat-vector
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/vector/**

# JWT 密钥（生产环境必须通过环境变量或 application-local.yml 设置）
jwt:
  secret: ${JWT_SECRET:}

# 内部服务调用 token（mcp-server -> mall-goods-order）
internal:
  token: ${INTERNAL_TOKEN:}
