server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.11:8848
      config:
        server-addr: 192.168.150.11:8848
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 192.168.150.11:8858
      eager: true
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: mall-product
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/product/**
        - id: mall-cart
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/cart/**
        - id: mall-order
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/order/**
        - id: mall-address
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/address/**
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/api/pay/**
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/api/tool/**
        - id: ai-chat-service
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/chat/**

# JWT 密钥（生产环境必须通过环境变量或 application-local.yml 设置）
jwt:
  secret: ${JWT_SECRET:}

# 内部服务调用 token（mcp-server -> mall-goods-order）
internal:
  token: ${INTERNAL_TOKEN:tianji-internal-token-2024}
