server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.11:8848
      config:
        server-addr: 192.168.150.11:8848
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 192.168.150.11:8858
        port: 8724
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: mall-user-center
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/user/center
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: mall-product
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/product/**
        - id: mall-cart
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/cart/**
        - id: mall-order
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/order/**
        - id: mall-address
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/address/**
        - id: mall-admin
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/admin/**
        - id: mall-coupon
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/coupon/**
        - id: mall-favorite
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/favorite/**
        - id: mall-review
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/review/**
        - id: mall-shop
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/shop/**
        - id: mall-seller
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/seller/**
        - id: mall-region
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/region/**
        - id: mall-notification
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/notification/**
        - id: mall-refund
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/refund/**
        - id: mall-home
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/home, /api/home/**
        - id: mall-group-buy
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/group-buy/**
        - id: mall-upload
          uri: lb://mall-goods-order
          predicates:
            - Path=/api/upload/**
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/api/pay/**
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/api/tool/**
        - id: ai-chat-service
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/chat/**
        - id: ai-chat-vector
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/vector/**

# JWT 密钥（生产环境必须通过环境变量或 application-local.yml 设置）
jwt:
  secret: ${JWT_SECRET:}

# 内部服务调用 token（mcp-server -> mall-goods-order）
internal:
  token: ${INTERNAL_TOKEN:tianji-internal-token-2024}
