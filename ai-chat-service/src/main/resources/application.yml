server:
  port: 8085

spring:
  application:
    name: ai-chat-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.150.11:3306/tianji_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.11:8848
      config:
        server-addr: 192.168.150.11:8848
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 192.168.150.11:8858
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ==================== Knife4j API 文档 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# SiliconFlow Embedding API（OpenAI 兼容）
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}
  base-url: https://api.siliconflow.cn/v1
  embedding-model: BAAI/bge-large-zh-v1.5

# Milvus 向量数据库连接
milvus:
  host: 192.168.150.11
  port: 19530
  collection-name: product_vectors
