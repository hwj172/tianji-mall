server:
  port: 8082

spring:
  application:
    name: mall-goods-order
  profiles:
    active: local
  config:
    import:
      - nacos:shared-config.yaml
      - nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.150.11:3306/tianji_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.11:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: 192.168.150.11:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
        fail-fast: false
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: 192.168.150.11:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.150.11:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
      openfeign:
        client:
          config:
            default:
              connectTimeout: 3000
              readTimeout: 10000
        compression:
          request:
            enabled: true
          response:
            enabled: true
        sentinel:
          enabled: true
  data:
    redis:
      host: 192.168.150.11
      port: 6379
      password: ${REDIS_PASSWORD:redis123}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
          time-between-eviction-runs: 30s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

rocketmq:
  name-server: 192.168.150.11:9876
  producer:
    group: mall-goods-order-producer
    access-key: ${ROCKETMQ_ACCESS_KEY:tianji-mall}
    secret-key: ${ROCKETMQ_SECRET_KEY:tianji-mall-secret}
  consumer:
    access-key: ${ROCKETMQ_ACCESS_KEY:tianji-mall}
    secret-key: ${ROCKETMQ_SECRET_KEY:tianji-mall-secret}
    max-reconsume-times: 3
    delay-level-when-next-consume: 3

file:
  upload-dir: ./uploads

search:
  use-fulltext: true

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# ==================== Knife4j API 文档 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn

# 内部服务调用 token（需与 gateway 一致，用于验证 X-Internal-Token 请求头）
internal:
  token: ${INTERNAL_TOKEN:}
