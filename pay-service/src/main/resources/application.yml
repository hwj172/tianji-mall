server:
  port: 8083

spring:
  application:
    name: pay-service
  profiles:
    active: local
  config:
    import:
      - nacos:shared-config.yaml
      - nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.150.11:3306/tianji_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    nacos:
      config:
        file-extension: yaml
        refresh-enabled: true
        fail-fast: false
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.150.11:8848
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# ==================== Knife4j API 文档 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn

alipay:
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: https://t8e56477.natappfree.cc/api/pay/notify

# 内部服务调用 token（需与 gateway 一致，用于验证和发送 X-Internal-Token 请求头）
internal:
  token: ${INTERNAL_TOKEN:}
